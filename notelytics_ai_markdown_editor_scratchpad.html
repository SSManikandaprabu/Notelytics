<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notelytics - Markdown Scratchpad & Note Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown Preview Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        /* Markdown Preview Styles */
        .markdown-body h1 { font-size: 1.875rem; font-weight: 800; margin-bottom: 1rem; color: #f8fafc; border-bottom: 1px solid #1e293b; padding-bottom: .5rem; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: .75rem; color: #f1f5f9; }
        .markdown-body h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: .5rem; color: #e2e8f0; }
        .markdown-body p { margin-bottom: 1rem; line-height: 1.7; color: #cbd5e1; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .markdown-body code { background-color: #1e293b; color: #38bdf8; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.875rem; }
        .markdown-body pre { background-color: #0b0f19; padding: 1rem; border-radius: 0.5rem; border: 1px solid #1e293b; margin-bottom: 1rem; overflow-x: auto; }
        .markdown-body pre code { background-color: transparent; color: #38bdf8; padding: 0; }
        .markdown-body blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; color: #94a3b8; font-style: italic; margin-bottom: 1rem; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden selection:bg-blue-500 selection:text-white">

    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-3.5 flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2.5 rounded-2xl text-white shadow-lg shadow-blue-500/25">
                <i class="fa-solid fa-pen-nib text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight flex items-center gap-2">
                    Notelytics <span class="text-xs bg-blue-500/20 text-blue-300 border border-blue-500/30 px-2.5 py-0.5 rounded-full font-medium">Markdown Studio</span>
                </h1>
                <p class="text-xs text-slate-400">Distraction-Free Writing & Live Markdown Preview</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="createNewNote()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-2 shadow-lg shadow-blue-900/30 transition">
                <i class="fa-solid fa-plus text-xs"></i> New Note
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Sidebar Note List -->
        <div class="w-full md:w-80 bg-slate-900/60 border-r border-slate-800 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Your Documents</span>
                <span id="noteCount" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">0 notes</span>
            </div>
            <div id="notesListContainer" class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- Dynamically populated note items -->
            </div>
        </div>

        <!-- Editor & Preview Workspace -->
        <div class="flex-1 flex flex-col lg:flex-row overflow-hidden bg-slate-950">
            
            <!-- Editor Pane -->
            <div class="flex-1 flex flex-col border-r border-slate-800 bg-slate-900 overflow-hidden">
                <div class="bg-slate-900/90 px-5 py-3 border-b border-slate-800 flex items-center justify-between">
                    <input type="text" id="noteTitleInput" oninput="updateActiveNoteTitle()" placeholder="Untitled Note..." class="bg-transparent font-bold text-slate-100 text-sm focus:outline-none w-full">
                    <div class="flex items-center space-x-2 shrink-0">
                        <span id="saveStatus" class="text-[11px] text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-circle text-[6px]"></i> Saved</span>
                    </div>
                </div>

                <div class="flex-1 flex flex-col relative bg-[#0b0f19]">
                    <textarea id="markdownInput" oninput="handleEditorInput()" placeholder="Type markdown content here... (# Heading, **bold**, *italic*, - list)" class="flex-1 bg-transparent text-slate-200 font-mono text-sm p-5 resize-none focus:outline-none leading-relaxed whitespace-pre tab-size-4"></textarea>
                </div>

                <!-- Footer Stats Bar -->
                <div class="p-3 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                    <div class="flex items-center space-x-4">
                        <span id="wordCount">0 words</span>
                        <span id="charCount">0 characters</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="exportMarkdown()" class="hover:text-white transition flex items-center gap-1"><i class="fa-solid fa-download"></i> Export .md</button>
                        <button onclick="deleteCurrentNote()" class="hover:text-rose-400 transition flex items-center gap-1"><i class="fa-regular fa-trash-can"></i> Delete</button>
                    </div>
                </div>
            </div>

            <!-- Live Preview Pane -->
            <div class="flex-1 flex flex-col bg-slate-950 overflow-hidden">
                <div class="bg-slate-900/90 px-5 py-3 border-b border-slate-800 flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i class="fa-regular fa-eye text-blue-400"></i> Live Preview
                    </span>
                    <button onclick="copyHtmlOutput()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                        <i class="fa-regular fa-copy"></i> Copy HTML
                    </button>
                </div>
                <div class="flex-1 overflow-y-auto p-6 md:p-8">
                    <div id="previewContainer" class="markdown-body max-w-3xl mx-auto">
                        <!-- Rendered markdown output appears here -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 border border-slate-700 text-slate-200 px-4 py-3 rounded-xl shadow-2xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-blue-400"></i>
        <span id="toastMsg" class="text-sm font-medium">Notification</span>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('notelytics_notes')) || [
            {
                id: '1',
                title: 'Welcome to Notelytics 📝',
                content: `# Welcome to Notelytics\n\nThis is a distraction-free markdown scratchpad and live preview editor.\n\n## Features:\n- **Real-time preview** using Marked.js\n- **Auto-saving** to browser localStorage\n- Word and character statistics\n- Export to Markdown (.md)\n\n> "Simplicity is the ultimate sophistication." — Leonardo da Vinci`,
                updatedAt: new Date().toISOString()
            }
        ];

        let activeNoteId = notes[0] ? notes[0].id : null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!activeNoteId && notes.length > 0) {
                activeNoteId = notes[0].id;
            }
            renderNotesList();
            loadActiveNote();
        });

        function renderNotesList() {
            const container = document.getElementById('notesListContainer');
            document.getElementById('noteCount').innerText = `${notes.length} notes`;

            if (notes.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-slate-500 text-xs italic">No documents yet. Click "New Note" above.</div>`;
                return;
            }

            container.innerHTML = notes.map(note => {
                const isActive = note.id === activeNoteId;
                return `
                    <div onclick="switchNote('${note.id}')" class="p-3 rounded-xl cursor-pointer transition border ${isActive ? 'bg-blue-600/20 border-blue-500/30 text-blue-200' : 'bg-slate-900 border-slate-800/80 hover:border-slate-700 text-slate-300'}">
                        <div class="font-semibold text-sm truncate mb-1">${note.title || 'Untitled Note'}</div>
                        <div class="text-[11px] text-slate-400 truncate">${note.content.substring(0, 45) || 'Empty note...'}</div>
                    </div>
                `;
            }).join('');
        }

        function switchNote(id) {
            activeNoteId = id;
            renderNotesList();
            loadActiveNote();
        }

        function loadActiveNote() {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            document.getElementById('noteTitleInput').value = note.title;
            document.getElementById('markdownInput').value = note.content;
            updatePreviewAndStats();
        }

        function handleEditorInput() {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            note.content = document.getElementById('markdownInput').value;
            note.updatedAt = new Date().toISOString();
            
            updatePreviewAndStats();
            saveToLocalStorage();
        }

        function updateActiveNoteTitle() {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            const titleVal = document.getElementById('noteTitleInput').value;
            note.title = titleVal || 'Untitled Note';
            note.updatedAt = new Date().toISOString();

            renderNotesList();
            saveToLocalStorage();
        }

        function updatePreviewAndStats() {
            const content = document.getElementById('markdownInput').value;
            
            // Render markdown preview with fallback if marked is loading
            const previewEl = document.getElementById('previewContainer');
            if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                previewEl.innerHTML = marked.parse(content);
            } else {
                previewEl.innerText = content;
            }

            // Update stats
            const words = content.trim() ? content.trim().split(/\s+/).length : 0;
            const chars = content.length;
            document.getElementById('wordCount').innerText = `${words} words`;
            document.getElementById('charCount').innerText = `${chars} characters`;
        }

        function createNewNote() {
            const newNote = {
                id: Date.now().toString(),
                title: 'Untitled Note',
                content: '# New Document\n\nStart writing your markdown notes here...',
                updatedAt: new Date().toISOString()
            };

            notes.unshift(newNote);
            activeNoteId = newNote.id;
            renderNotesList();
            loadActiveNote();
            showToast('New note created!', 'success');
        }

        function deleteCurrentNote() {
            if (notes.length <= 1) {
                showToast('Cannot delete the last remaining note.', 'error');
                return;
            }

            if (confirm('Are you sure you want to delete this note?')) {
                notes = notes.filter(n => n.id !== activeNoteId);
                activeNoteId = notes[0].id;
                renderNotesList();
                loadActiveNote();
                saveToLocalStorage();
                showToast('Note deleted.', 'info');
            }
        }

        function exportMarkdown() {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            const blob = new Blob([note.content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(note.title || 'note').toLowerCase().replace(/\s+/g, '_')}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Markdown file exported!', 'success');
        }

        function copyHtmlOutput() {
            const htmlContent = document.getElementById('previewContainer').innerHTML;
            const textarea = document.createElement('textarea');
            textarea.value = htmlContent;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('Rendered HTML copied to clipboard!', 'success');
        }

        function saveToLocalStorage() {
            localStorage.setItem('notelytics_notes', JSON.stringify(notes));
            const status = document.getElementById('saveStatus');
            status.innerHTML = `<i class="fa-solid fa-circle text-[6px]"></i> Saved`;
            setTimeout(() => {
                status.innerHTML = `<i class="fa-solid fa-circle text-[6px]"></i> Up to date`;
            }, 1000);
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
